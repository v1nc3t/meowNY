# Load DB_* values from the repo-root .env (Docker Compose reads this automatically; Spring Boot does not)
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL Connectivity Settings
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meowny_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Port
server.port=8080

# JWT (set JWT_SECRET in .env — must be at least 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Password hashing pepper (set APP_SECURITY_PEPPER in .env)
app.security.pepper=${APP_SECURITY_PEPPER}

# CORS (comma-separated origins)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Error responses
server.error.include-stacktrace=never
server.error.include-message=never