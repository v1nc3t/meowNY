# Load DB_* values from the repo-root .env (Docker Compose reads this automatically; Spring Boot does not)
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL Connectivity Settings
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meowny_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Port
server.port=8080