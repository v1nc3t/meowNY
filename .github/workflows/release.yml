name: Release

# Builds every installer for a version and publishes them on a GitHub release. It starts when a tag like v0.2.0 is pushed,
# which `npm run release 0.2.0` makes (docs/releasing.md):
#   Linux    meowNY_<v>_amd64.deb (installs meowny-desktop and the meowny command line) and meowNY_<v>_amd64.AppImage
#   Windows  meowNY_<v>_x64-setup.exe
#   Android  meowNY_<v>_android.apk, signed with the release key from the repository secrets
#   iPhone   meowNY_<v>_iphone.ipa, unsigned (AltStore or SideStore sign it on the phone), and altstore.json for updates
#   and      the meowny command line for Linux and Windows, SHA256SUMS, and a build attestation for every file
# The desktop installers are not signed yet, so Windows shows a SmartScreen warning the first time.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  NDK_VERSION: 27.2.12479018

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The tag and the app must agree, or the files would carry one version and the release another.
      - id: v
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::The tag says $tag but src-tauri/tauri.conf.json says $app. Make releases with: npm run release $tag"
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported Ubuntu, so the AppImage also runs on systems with an older glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
      # The AppImage tools are AppImages themselves; this runs them without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Built first, so the .deb can carry it: one install gives both programs on the PATH.
      - name: Build the command line
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target-dir src-tauri/target

      - name: Build the app
        run: |
          npm run tauri build -- --bundles deb,appimage \
            --config "{\"bundle\":{\"linux\":{\"deb\":{\"files\":{\"/usr/bin/meowny\":\"$GITHUB_WORKSPACE/src-tauri/target/release/meowny\"}}}}}"

      - name: Collect the files
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp src-tauri/target/release/meowny "out/meowny-${V}-linux-x86_64"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build the app
        run: npm run tauri build -- --bundles nsis

      - name: Build the command line
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target-dir src-tauri/target

      - name: Collect the files
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/meowny.exe "out/meowny-${V}-windows-x86_64.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Without the release key a phone could not update from one version to the next, so the job stops here, not later.
      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS to the repository secrets (docs/releasing.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The same NDK as the Android workflow, and the build tools for apksigner.
      - name: Install the NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-37.0" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: npm ci

      # As in the Android workflow: the icon, then no Android backup of the app's folder and a window that cannot be captured.
      - name: Make the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/logo-android.png --ios-color transparent
          python3 scripts/android-patch.py src-tauri/gen/android

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64

      # Gradle leaves the release APK unsigned; apksigner signs it with the key that every later version must share.
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          if [ -z "$unsigned" ]; then echo "::error::No release APK was built"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          mkdir out
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "out/meowNY_${V}_android.apk" "$unsigned"
          "$tools/apksigner" verify --print-certs "out/meowNY_${V}_android.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  ios:
    needs: version
    # Xcode 26, as in the iOS workflow (release builds fail to link on Xcode 27 until tauri PR #16246 ships).
    runs-on: macos-26
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: npm ci

      - name: Make the iOS project
        run: |
          npx tauri ios init --ci --skip-targets-install
          npx tauri icon src-tauri/icons/logo-ios.png --ios-color '#ffffff'

      - name: Build the IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign

      - name: Collect the files
        run: |
          mkdir out
          cp src-tauri/gen/apple/build/arm64/*.ipa "out/meowNY_${V}_iphone.ipa"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, linux, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and the AltStore source
        working-directory: dist
        run: |
          python3 ../scripts/altstore-source.py "$V" "meowNY_${V}_iphone.ipa" > altstore.json
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Anyone can check that a file was built here from this tag: gh attestation verify FILE --repo v1nc3t/meowNY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        run: |
          cat > notes.md <<EOF
          **Pre-release.** Back up your data before you update.

          | | Install | Update |
          |---|---|---|
          | Linux | \`sudo apt install ./meowNY_${V}_amd64.deb\` (also puts \`meowny\` on the PATH), or make the AppImage executable and run it | Install the new file the same way |
          | Windows | Run \`meowNY_${V}_x64-setup.exe\`. The installer is not signed yet: on the SmartScreen warning choose *More info*, then *Run anyway* | Run the new installer |
          | Android | Open \`meowNY_${V}_android.apk\` on the phone | Add this repository to [Obtainium](https://github.com/ImranR98/Obtainium), or open the new APK |
          | iPhone | In AltStore or SideStore add the source \`https://github.com/v1nc3t/meowNY/releases/latest/download/altstore.json\` and install meowNY | AltStore offers each new version |

          Check a download: \`sha256sum -c SHA256SUMS --ignore-missing\`, or \`gh attestation verify FILE --repo v1nc3t/meowNY\`.
          EOF
          gh release create "v${V}" dist/* --verify-tag --title "meowNY ${V}" --notes-file notes.md --generate-notes
