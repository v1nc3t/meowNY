name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The documentation site: its own tests, and a check that docs/CLI.md is what the generator makes. The facts on the
  # site are checked against the program by the command line's own tests (see desktop.yml).
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the generator
        run: node --test docs/site/build.test.mjs

      - name: Check the page and docs/CLI.md
        run: node docs/site/build.mjs --check
