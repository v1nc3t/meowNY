name: Docs site

# Publishes the website (docs/site/) to GitHub Pages: https://v1nc3t.github.io/meowNY/
# A landing page, the guide and the command line reference, in the app's colours (ui/src/styles/tokens.css).
# One-time setup: in the repository's Settings, Pages, set Source to "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cli/schema.json'
      - 'ui/src/styles/tokens.css'
      - 'ui/public/favicon.svg'
      # The landing page shows the version.
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits rather than cancelling one that is half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same checks as for every push: the generator's tests, and that docs/CLI.md is up to date.
      - name: Test the generator
        run: node --test docs/site/build.test.mjs

      - name: Check the page
        run: node docs/site/build.mjs --check

      - name: Build the site
        run: node docs/site/build.mjs

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
