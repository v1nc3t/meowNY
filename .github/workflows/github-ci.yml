name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meowny
          POSTGRES_PASSWORD: meowny
          POSTGRES_DB: meowny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meowny -d meowny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://meowny:meowny@127.0.0.1:5432/meowny
      DATABASE_URL_TEST: postgres://meowny:meowny@127.0.0.1:5432/meowny_test
      PORT: 3000
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Migrate
        working-directory: server
        run: npm run migrate

      - name: Test
        working-directory: server
        run: npm test

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees every commit, not just the latest.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Fails on known high or critical advisories in anything that ships.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Build tooling is reported but does not block: fixes can need breaking upgrades.
      - name: npm audit (all dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
