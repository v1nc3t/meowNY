name: iOS

# The phone app for iPhone: the same UI and the same Rust core as the desktop, packaged by Tauri mobile. The result is an unsigned
# IPA for AltStore or SideStore, which sign it with the person's own Apple ID when they install it. App Store signing belongs to
# the release phase, so nothing here has a secret.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  ipa:
    # Xcode 26 by default. Not Xcode 27 yet: release builds fail to link there until Tauri ships its fix (tauri PR #16246).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install
        run: npm ci

      # The Xcode project is generated, not kept in git (it brings xcodegen itself). `ios build` merges src-tauri/Info.ios.plist
      # (the camera and home network texts) into it, and the app keeps its data folder out of iCloud backups at every start.
      - name: Make the iOS project
        run: npx tauri ios init --ci --skip-targets-install

      # --no-sign: no Apple account here. AltStore or SideStore signs the app on the person's own device.
      - name: Build the IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: meowny-ios-unsigned
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
