name: Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'cli/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'cli/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never debugs these binaries: no incremental data and no debug symbols
  # means less to compile, link and cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build on Linux only (about 2.5 minutes). The macOS and Windows builds are slower,
        # mostly because OpenSSL is compiled from source (about 10 minutes on Windows), so they run when
        # code reaches main, or on demand from the Actions tab ("Run workflow") for any branch.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","bundle":"deb"}]' || '[{"os":"ubuntu-latest","bundle":"deb"},{"os":"macos-latest","bundle":"app"},{"os":"windows-latest","bundle":"nsis"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the dependency build even when a later step fails.
          cache-on-failure: true
          # Only main writes the cache. Branches and PRs restore it, so each OS keeps one
          # warm cache instead of every branch pushing its own and evicting the others.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install
        run: npm ci

      - name: Outbound network call sites
        run: npm run check:outbound

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # The command line program. Its tests run the real binary against the app's own server code, so they
      # build the app library too; sharing the target folder reuses what `cargo test` just compiled.
      - name: Rust tests (command line)
        working-directory: cli
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: cargo test --locked

      # Unsigned debug build with one bundle per OS. It reuses the compiled
      # dependencies from `cargo test`. Release builds and every installer are
      # made by release.yml from a version tag.
      - name: Build app
        run: npm run tauri build -- --debug --bundles ${{ matrix.bundle }}
