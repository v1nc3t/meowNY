name: Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never debugs these binaries: no incremental data and no debug symbols
  # means less to compile, link and cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the dependency build even when a later step fails.
          cache-on-failure: true

      - name: Install
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Unsigned debug build with one bundle per OS. It reuses the compiled
      # dependencies from `cargo test`. Release builds, all installer formats,
      # signing and notarisation come with the release phase.
      - name: Build app
        run: npm run tauri build -- --debug --bundles ${{ matrix.bundle }}
