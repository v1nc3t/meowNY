name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, so new advisories are caught even when nobody pushes.
    - cron: '17 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees every commit, not just the latest.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Fails on known high or critical advisories in anything that ships.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Build tooling is reported but does not block: fixes can need breaking upgrades.
      - name: npm audit (all dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
