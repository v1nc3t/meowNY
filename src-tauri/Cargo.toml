[package]
# The desktop program is `meowny-desktop`. The command line, in cli/, is `meowny`.
name = "meowny-desktop"
version = "0.2.4"
description = "meowNY: local-first expense tracker"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "meowny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
getrandom = "0.3.4"
hkdf = "0.12.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.5"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3.27.0"
# The mock runtime, to call the commands through the same message layer the page uses.
tauri = { version = "2", features = ["test"] }

# A computer only. Excel and PDF exports, and the fonts they need, and the file dialogs that say where a file goes: the phone has
# none of these (it cannot save a file for the person yet, and the desktop keeps the backups and exports), so they and the two
# embedded fonts are left out of its build. And the OS keychain: the phone app (Android and iOS) keeps its secret in a file and
# relies on its passphrase.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
krilla = { version = "0.6.0", default-features = false, features = ["simple-text"] }
rust_xlsxwriter = "0.100.0"
skrifa = "0.37"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# The camera of the phone, which reads the QR code that the desktop shows. It is built for the phone only; the desktop does not
# contain it. If it ever breaks, pairing and syncing stop and the rest of the app does not.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# iOS only: the flag that keeps the data folder out of iCloud backups. Tauri already builds this crate with these parts on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSValue", "NSError"] }
