[package]
name = "meowny"
version = "0.1.0"
description = "meowNY: local-first expense tracker"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "meowny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
getrandom = "0.3.4"
hkdf = "0.12.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.5"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
