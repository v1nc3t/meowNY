[package]
name = "meowny"
version = "0.1.0"
description = "meowNY: local-first expense tracker"
edition = "2021"
rust-version = "1.77"

[lib]
name = "meowny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
