services:
  postgres:
    image: postgres:16-alpine
    container_name: meowny-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: meowny
      POSTGRES_USER: meowny
      POSTGRES_PASSWORD: meowny
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowny -d meowny"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: meowny-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
